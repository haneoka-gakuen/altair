name: Bug report
description: Report a reproducible Altair, conversion, preview, or Studio defect
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not disclose security vulnerabilities here; use private vulnerability reporting.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - WebGAL compatibility
        - Vega compilation
        - AI adaptation
        - Plugins
        - Preview client
        - Studio
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Remove private story text and assets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
