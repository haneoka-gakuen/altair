          ref: 3004ea0cbe45cdd3e511a3201509bce6a60fd69f
          path: altair/.dependencies/altair-plugin-bestdori
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/design-tokens
          ref: 5f5db632b974f11e5d096fba8ceccf8af1758c1f
          path: altair/.dependencies/design-tokens
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/vega-plugin-spine
