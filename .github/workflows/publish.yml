name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: altair-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Altair
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: altair
          persist-credentials: false

      - name: Check out Vega
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/vega
          path: altair/.dependencies/vega
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/vega-plugin-richtext
          path: altair/.dependencies/vega-plugin-richtext
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/altair-plugin-adv
          path: altair/.dependencies/altair-plugin-adv
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/altair-plugin-drafts
          path: altair/.dependencies/altair-plugin-drafts
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/altair-plugin-flow
          path: altair/.dependencies/altair-plugin-flow
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/altair-plugin-history
          path: altair/.dependencies/altair-plugin-history
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/altair-plugin-marketplace
          path: altair/.dependencies/altair-plugin-marketplace
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/altair-plugin-prose
          path: altair/.dependencies/altair-plugin-prose
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/altair-plugin-vega-preview
          path: altair/.dependencies/altair-plugin-vega-preview
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/altair-plugin-webgal
          path: altair/.dependencies/altair-plugin-webgal
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/altair-plugin-workspace-browser
          path: altair/.dependencies/altair-plugin-workspace-browser
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/altair-preset-full
          path: altair/.dependencies/altair-preset-full
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/vega-marketplace
          path: altair/.dependencies/vega-marketplace
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/vega-plugin-webgal
          path: altair/.dependencies/vega-plugin-webgal
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/vega-renderer-three
          path: altair/.dependencies/vega-renderer-three
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/vega-shell-default
          path: altair/.dependencies/vega-shell-default
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/vega-theme-haneoka
          path: altair/.dependencies/vega-theme-haneoka
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/vega-ui-portable
          path: altair/.dependencies/vega-ui-portable
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/altair-plugin-models
          path: altair/.dependencies/altair-plugin-models
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/vega-plugin-composite
          path: altair/.dependencies/vega-plugin-composite
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/vega-plugin-cubism
          path: altair/.dependencies/vega-plugin-cubism
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/altair-plugin-haneoka
          ref: 3ecee71da00461b1d78c105e6af8ce00dc644642
          path: altair/.dependencies/altair-plugin-haneoka
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/altair-plugin-bestdori
          ref: 03bccda351d9ca167575770ce4c29b841089f3ff
          path: altair/.dependencies/altair-plugin-bestdori
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/design-tokens
          ref: 5f5db632b974f11e5d096fba8ceccf8af1758c1f
          path: altair/.dependencies/design-tokens
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/vega-plugin-spine
          ref: afe6d6219a74ae237dd1472e917a72ebbc47d237
          path: altair/.dependencies/vega-plugin-spine
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/vega-preset-full
          ref: 4cc0d8ef43fc8768b0ba1ae5cf3c8dffb718ac29
          path: altair/.dependencies/vega-preset-full
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/vega-plugin-ending
          ref: ef4d8d18930326db0f54268f14764261ef80bfbc
          path: altair/.dependencies/vega-plugin-ending
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/vega-plugin-richtext-bbcode
          ref: 9365fbf87f931121ff1f074ba7d2c9bdf0ccf7be
          path: altair/.dependencies/vega-plugin-richtext-bbcode
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/vega-plugin-richtext-html
          ref: 7217b47ebc68edab4bf90f6197c8f0409422a341
          path: altair/.dependencies/vega-plugin-richtext-html
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/vega-plugin-richtext-latex
          ref: 15a842638e56874f35fcf437f93a4b8ae1955490
          path: altair/.dependencies/vega-plugin-richtext-latex
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/vega-plugin-richtext-markdown
          ref: c8fe55aa8e9980b8a0ccd9359e79623205946901
          path: altair/.dependencies/vega-plugin-richtext-markdown
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/vega-plugin-richtext-typst
          ref: ff2d54a71162e0db8d36ab21085510df813ec15b
          path: altair/.dependencies/vega-plugin-richtext-typst
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/vega-plugin-haneoka
          ref: d043969901fb3382751338dfd2bb080b356ab130
          path: altair/.dependencies/vega-plugin-haneoka
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.14.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release version
        working-directory: altair
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/verify-release-tag.mjs

      - name: Install release dependencies
        working-directory: altair
        run: pnpm install --no-frozen-lockfile --filter @haneoka/altair... --filter @haneoka/altair-preview-client... --filter @haneoka/altair-ui-react... --filter @haneoka/vega...

      - name: Build Vega protocol
        working-directory: altair
        run: pnpm --filter @haneoka/vega-protocol build

      - name: Check packages
        working-directory: altair
        run: pnpm check:core && pnpm --filter @haneoka/altair-preview-client check && pnpm --filter @haneoka/altair-ui-react typecheck && pnpm --filter @haneoka/altair-ui-react build

      - name: Publish authoring toolkit
        working-directory: altair
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package_name=$(node -p "require('./package.json').name.replaceAll('/', '-')")
          package_dir="$RUNNER_TEMP/$package_name"
          mkdir -p "$package_dir"
          pnpm pack --pack-destination "$package_dir"
          npm publish "$package_dir"/*.tgz --access public --provenance

      - name: Publish preview client
        working-directory: altair/packages/preview-client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package_name=$(node -p "require('./package.json').name.replaceAll('/', '-')")
          package_dir="$RUNNER_TEMP/$package_name"
          mkdir -p "$package_dir"
          pnpm pack --pack-destination "$package_dir"
          npm publish "$package_dir"/*.tgz --access public --provenance

      - name: Publish React extension UI
        working-directory: altair/packages/ui-react
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package_name=$(node -p "require('./package.json').name.replaceAll('/', '-')")
          package_dir="$RUNNER_TEMP/$package_name"
          mkdir -p "$package_dir"
          pnpm pack --pack-destination "$package_dir"
          npm publish "$package_dir"/*.tgz --access public --provenance
