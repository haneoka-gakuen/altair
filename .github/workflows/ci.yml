name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: altair-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out Altair
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: altair
          persist-credentials: false

      # The three repositories are developed side by side. Building the shared
      # protocol first keeps CI honest without copying Vega runtime code here.
      - name: Check out Vega
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/vega
          ref: 2fa1b39c1176852db38a45b453c737e8e3439f5d
          path: altair/.dependencies/vega
          persist-credentials: false

      - name: Check out WebGAL compatibility plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/altair-plugin-webgal
          ref: b2524189a84c510c0275a8050905458d0a56430e
          path: altair/.dependencies/altair-plugin-webgal
          persist-credentials: false

      - name: Check out ADV authoring plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/altair-plugin-adv
          ref: bfc4061296dfa589b6b8d586a369b3ff445c340d
          path: altair/.dependencies/altair-plugin-adv
          persist-credentials: false

      - name: Check out flow authoring plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/altair-plugin-flow
          ref: c61fa42f9ee4ff5e587c3dd90f3ed2414414bcc3
          path: altair/.dependencies/altair-plugin-flow
          persist-credentials: false

      - name: Check out history authoring plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/altair-plugin-history
          ref: f7622667bc6032d4804ef94cbe42dbc1bad87e1d
          path: altair/.dependencies/altair-plugin-history
          persist-credentials: false

      - name: Check out drafts authoring plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/altair-plugin-drafts
          ref: 8ff0281b86cb9bba22403712e0c6886edb21b01b
          path: altair/.dependencies/altair-plugin-drafts
          persist-credentials: false

      - name: Check out prose authoring plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/altair-plugin-prose
          ref: 4f37e3270bc7b4b8db3a9b7c034e03c58c9f1045
          path: altair/.dependencies/altair-plugin-prose
          persist-credentials: false

      - name: Check out authoring marketplace plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/altair-plugin-marketplace
          ref: 55913c01a38011c26710da5ff94e45d55fe5508f
          path: altair/.dependencies/altair-plugin-marketplace
          persist-credentials: false

      - name: Check out Vega preview authoring plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/altair-plugin-vega-preview
          ref: f826b4e39043cbe8ae17d7fc77e66ee062381ca0
          path: altair/.dependencies/altair-plugin-vega-preview
          persist-credentials: false

      - name: Check out browser workspace plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/altair-plugin-workspace-browser
          ref: ddecaedd4fc78ca1ad50a95fd10ad3771a2d5b05
          path: altair/.dependencies/altair-plugin-workspace-browser
          persist-credentials: false

      - name: Check out full authoring preset
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/altair-preset-full
          ref: b0b97ecc8f9b951bb2678ae9f73d779ad5957fb2
          path: altair/.dependencies/altair-preset-full
          persist-credentials: false

      - name: Check out Vega marketplace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/vega-marketplace
          ref: 8e3e3a2fd288f8b1d4e43f9fce43b6de3650449c
          path: altair/.dependencies/vega-marketplace
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/vega-renderer-three
          ref: 33a9127d9537cc5c303fceaa35fafda403713b42
          path: altair/.dependencies/vega-renderer-three
          persist-credentials: false

      - name: Check out Haneoka theme
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/vega-theme-haneoka
          ref: 44482e2b9f8d58cf5311a02ac10b2d6694d039ab
          path: altair/.dependencies/vega-theme-haneoka
          persist-credentials: false

      - name: Check out Vega WebGAL runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/vega-plugin-webgal
          ref: 0d68dbd063eb1d113ecefda587f38b6b9c78e3f9
          path: altair/.dependencies/vega-plugin-webgal
          persist-credentials: false

      - name: Check out Vega default shell
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/vega-shell-default
          ref: ab0494d9a7b46e3221e827a3649aa83a06d772f6
          path: altair/.dependencies/vega-shell-default
          persist-credentials: false

      - name: Check out Vega portable UI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/vega-ui-portable
          ref: 06af193c1c7c7939394469aec5e7cfa7e71b220d
          path: altair/.dependencies/vega-ui-portable
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/vega-plugin-richtext
          ref: c043823cbb2c63a6966343db2e9ef0fb8ba4b703
          path: altair/.dependencies/vega-plugin-richtext
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/altair-plugin-models
          ref: b09c3b838d5b89d01b5a74c188e328c2a4c0d110
          path: altair/.dependencies/altair-plugin-models
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/vega-plugin-composite
          ref: 5c151e08ee4e8cad9a0fbd98e97d06260b507b66
          path: altair/.dependencies/vega-plugin-composite
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/vega-plugin-cubism
          ref: 0994e901e2c926c96072603ad40daaf180add9a5
          path: altair/.dependencies/vega-plugin-cubism
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/altair-plugin-haneoka
          ref: d82487d031f8c53996d202ebb67e66f796b43757
          path: altair/.dependencies/altair-plugin-haneoka
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/altair-plugin-bestdori
          ref: 3004ea0cbe45cdd3e511a3201509bce6a60fd69f
          path: altair/.dependencies/altair-plugin-bestdori
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/design-tokens
          ref: 5f5db632b974f11e5d096fba8ceccf8af1758c1f
          path: altair/.dependencies/design-tokens
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/vega-plugin-spine
          ref: 96b185e9d78bbce885dfbfe6e3fbdce8a500e7ee
          path: altair/.dependencies/vega-plugin-spine
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/vega-preset-full
          ref: 40ea3118f9a3b29925338e9c3330f486315993f7
          path: altair/.dependencies/vega-preset-full
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/vega-plugin-ending
          ref: 2e50639f6540623beeed3ad5ece389bc50ec3309
          path: altair/.dependencies/vega-plugin-ending
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/vega-plugin-richtext-bbcode
          ref: 9365fbf87f931121ff1f074ba7d2c9bdf0ccf7be
          path: altair/.dependencies/vega-plugin-richtext-bbcode
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/vega-plugin-richtext-html
          ref: 7217b47ebc68edab4bf90f6197c8f0409422a341
          path: altair/.dependencies/vega-plugin-richtext-html
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/vega-plugin-richtext-latex
          ref: 15a842638e56874f35fcf437f93a4b8ae1955490
          path: altair/.dependencies/vega-plugin-richtext-latex
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/vega-plugin-richtext-markdown
          ref: c8fe55aa8e9980b8a0ccd9359e79623205946901
          path: altair/.dependencies/vega-plugin-richtext-markdown
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/vega-plugin-richtext-typst
          ref: 20e233d18b95eabd862c7948ecb80462c96ca130
          path: altair/.dependencies/vega-plugin-richtext-typst
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/vega-plugin-haneoka
          ref: d02da4c16eee7413dbc07ade34ac288d05926456
          path: altair/.dependencies/vega-plugin-haneoka
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: "11.14.0"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: altair/pnpm-lock.yaml
      - name: Set up locked Vega Rust and WASM tools
        uses: ./altair/.dependencies/vega/.github/actions/setup-wasm

      - name: Install dependencies
        working-directory: altair
        # Source dependencies are checked out above and may have newer workspace
        # manifests than this repository's registry lockfile.
        run: pnpm install --no-frozen-lockfile

      - name: Build the shared preview protocol
        working-directory: altair
        run: pnpm --filter @haneoka/vega-protocol build

      - name: Build the bundled Vega preview runtime
        working-directory: altair
        run: pnpm --filter @haneoka/vega build:core

      - name: Build trusted official preview plugins
        working-directory: altair
        run: |
          pnpm --filter @haneoka/vega-catalog-official build
          pnpm --filter @haneoka/design-tokens build
          pnpm --filter @haneoka/vega-renderer-three build
          pnpm --filter @haneoka/vega-plugin-richtext build
          pnpm --filter @haneoka/vega-plugin-haneoka build
          pnpm --filter @haneoka/vega-theme-haneoka build
          pnpm --filter @haneoka/vega-plugin-webgal build
          pnpm --filter @haneoka/vega-plugin-cubism build
          pnpm --filter @haneoka/vega-plugin-spine build
          pnpm --filter @haneoka/vega-plugin-composite build
          pnpm --filter @haneoka/vega-shell-default build
          pnpm --filter @haneoka/vega-ui-portable build
          pnpm --filter @haneoka/vega-plugin-ending build
          pnpm --filter @haneoka/vega-plugin-richtext-bbcode build
          pnpm --filter @haneoka/vega-plugin-richtext-html build
          pnpm --filter @haneoka/vega-plugin-richtext-latex build
          pnpm --filter @haneoka/vega-plugin-richtext-markdown build
          pnpm --filter @haneoka/vega-plugin-richtext-typst build
          pnpm --filter @haneoka/vega-preset-full build

      - name: Build Altair packages
        working-directory: altair
        run: |
          pnpm run build:core
          pnpm --filter @haneoka/altair-ui-react build
          pnpm --filter @haneoka/altair-preview-client build

      - name: Build trusted official authoring plugins
        working-directory: altair
        run: |
          pnpm --filter @haneoka/altair-plugin-adv build
          pnpm --filter @haneoka/altair-plugin-models build
          pnpm --filter @haneoka/altair-plugin-flow build
          pnpm --filter @haneoka/altair-plugin-history build
          pnpm --filter @haneoka/altair-plugin-drafts build
          pnpm --filter @haneoka/altair-plugin-marketplace build
          pnpm --filter @haneoka/altair-plugin-prose build
          pnpm --filter @haneoka/altair-plugin-vega-preview build
          pnpm --filter @haneoka/altair-plugin-webgal build
          pnpm --filter @haneoka/altair-plugin-workspace-browser build
          pnpm --filter @haneoka/altair-preset-full build

      - name: Build pinned public resource providers
        working-directory: altair
        run: |
          pnpm --filter @haneoka/altair-plugin-haneoka build
          pnpm --filter @haneoka/altair-plugin-bestdori build

      - name: Check Altair, preview client, and Studio
        working-directory: altair
        run: pnpm check

      - name: Verify the published core package
        working-directory: altair
        run: pnpm pack --dry-run
