packages:
  - "."
  - "apps/*"
  - "packages/*"
  # Release CI materializes source dependencies in this ignored workspace.
  # Normal consumers resolve the same semver from the registry.
  - ".dependencies/vega"
  - ".dependencies/vega/packages/protocol"
  - ".dependencies/vega-marketplace"
  - ".dependencies/vega-renderer-pixi"
  - ".dependencies/vega-plugin-richtext"
  - ".dependencies/vega-theme-haneoka"
  - ".dependencies/vega-plugin-webgal"
  - ".dependencies/vega-shell-default"
  - ".dependencies/vega-ui-portable"
  - ".dependencies/altair-plugin-adv"
  - ".dependencies/altair-plugin-flow"
  - ".dependencies/altair-plugin-history"
  - ".dependencies/altair-plugin-drafts"
  - ".dependencies/altair-plugin-marketplace"
  - ".dependencies/altair-plugin-prose"
  - ".dependencies/altair-plugin-vega-preview"
  - ".dependencies/altair-plugin-webgal"
  - ".dependencies/altair-plugin-workspace-browser"
  - ".dependencies/altair-preset-full"

linkWorkspacePackages: true

allowBuilds:
  esbuild: true
